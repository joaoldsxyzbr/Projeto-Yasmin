name: Verificar aplicação

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --no-fund

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Gerar build de produção
        run: npm run build

      - name: Validar PWA
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8'));if(m.display!=='standalone'||!m.icons?.some(i=>i.sizes==='192x192')||!m.icons?.some(i=>i.sizes==='512x512')||!m.icons?.some(i=>i.purpose==='maskable'))process.exit(1)"
          test -f dist/sw.js
          test -f dist/favicon.svg
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
          test -f dist/icons/apple-touch-icon.png
